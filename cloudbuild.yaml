# Pipeline de Cloud Build, con el mismo formato de los demás de Sapiencia: en
# cada push a main compila la imagen, la sube a Artifact Registry y la despliega
# en Cloud Run. Las sustituciones se definen en el trigger; los valores de abajo
# son los de este servicio. El servicio conserva su configuración (variables
# MYSQL_*, secreto de la contraseña, red con IP fija de salida).

substitutions:
  _REPOSITORY_NAME: repo-docker
  _IMAGE_NAME: encuesta-expectativas
  _SERVICE_NAME: encuesta-expectativas
  _PORT: '8080'

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY_NAME/$_IMAGE_NAME', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY_NAME/$_IMAGE_NAME']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      [
        'run','deploy','$_SERVICE_NAME',
        '--image','us-central1-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY_NAME/$_IMAGE_NAME',
        '--region','us-central1',
        '--port','$_PORT',
        '--allow-unauthenticated'
      ]
